name: ui-check
on:
  push:
    branches: [ui-check]
    paths-ignore: ["ci/out/**"]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt playwright && python -m playwright install --with-deps chromium > /dev/null
      - run: python ci/seed.py "$PWD" > seed.log 2>&1 || true
        env: {FAKE_DB: /tmp/fake_db.json}
      - run: |
          REPO_DIR="$PWD" FAKE_DB=/tmp/fake_db.json TY_PASSWORD=ci-pass streamlit run ci/run_app.py --server.headless true > app.log 2>&1 &
          sleep 15
          python ci/shoot.py > shoot.log 2>&1 || true
      - if: always()
        run: |
          mkdir -p ci/out && cp -r shots/. ci/out/ 2>/dev/null; cp seed.log app.log shoot.log ci/out/ 2>/dev/null
          git config user.name ci && git config user.email ci@example.com
          git add ci/out && git commit -qm "ci screenshots" && git push
