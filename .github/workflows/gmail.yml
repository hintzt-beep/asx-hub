name: gmail
# Personal Gmail agent. Run by hand: Actions > gmail > Run workflow.
# This repo is public, so these logs are public: the agent prints counts only, never senders,
# subjects or bodies. Turn the agent off by setting the repo variable GMAIL_AGENT_ENABLED to 0.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "report = show sorting, apply = add Agent/ labels, undo = remove the last apply's labels, scan = counts"
        type: choice
        options: [report, apply, undo, scan]
        default: report
      dry_run:
        description: "Dry run (changes nothing). Untick to really apply or undo."
        type: boolean
        default: true
  pull_request:
    paths: ["gmail_agent/**", "tests/**", ".github/workflows/gmail.yml"]
  push:
    branches: [main]
    paths: ["gmail_agent/**", "tests/**", ".github/workflows/gmail.yml"]
concurrency:
  group: gmail             # its own lock: never shares or blocks the trading runs
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r gmail_agent/requirements.txt
      - run: python -m unittest discover -s tests -t . -v
  scan:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r gmail_agent/requirements.txt
      - run: python -m gmail_agent.cli ${{ inputs.command || 'report' }}
        env:
          GMAIL_AGENT_ENABLED: ${{ vars.GMAIL_AGENT_ENABLED || '1' }}
          GMAIL_DRY_RUN: ${{ inputs.dry_run == false && '0' || '1' }}
          GMAIL_WORK_DOMAINS: ${{ vars.GMAIL_WORK_DOMAINS }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
