name: lab
on:
  schedule:
    - cron: "0 12 * * 6"     # Saturday night Melbourne (11pm AEDT / 10pm AEST)
  workflow_dispatch:
  push:
    branches: [strategy-lab]   # TEMP: first real run from the work branch
concurrency:
  group: lab                 # its own lock: it only reads past prices and writes system/lab_results
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy
      - run: python strategy_lab.py --out lab_results.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - name: Keep a copy of the results (no personal data) on the lab-results branch
        if: success()
        run: |
          git config user.name "lab bot" && git config user.email "lab-bot@users.noreply.github.com"
          git checkout --orphan lab-results
          git rm -rq --cached . && git clean -fdq -e lab_results.json
          git add lab_results.json && git commit -qm "Strategy Lab results $(date -u +%F)"
          git push -fq origin lab-results
